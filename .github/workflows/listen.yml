name: Check for game requests

on:
  schedule:
    # GitHub only honours this on the default branch, and timing drifts under
    # load. Five minutes is the floor it accepts.
    - cron: "*/5 * * * *"
  # Lets you test the hosted path from a branch before merging.
  workflow_dispatch:

# Two overlapping polls would send the same game twice.
concurrency:
  group: guessing-game-listener
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Rosters hold real names and addresses, so they are secrets rather than
      # files in the repo. Written to disk here and gone when the job ends.
      # Every GROUP_* secret becomes a roster, so a new group needs no change
      # to this file.
      - name: Restore rosters
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          # printf, not echo: a roster arrives as JSON with \n escapes, and
          # echo expands those into real newlines and corrupts the JSON.
          printf '%s' "$ALL_SECRETS" > secrets.json
          trap 'rm -f secrets.json' EXIT

          found=0
          for key in $(jq -r 'keys[] | select(startswith("GROUP_"))' secrets.json); do
            group=$(printf '%s' "${key#GROUP_}" | tr '[:upper:]' '[:lower:]')
            jq -r --arg k "$key" '.[$k]' secrets.json > ".env.$group"
            echo "restored .env.$group"
            found=$((found + 1))
          done

          if [ "$found" -eq 0 ]; then
            echo "No GROUP_* secrets are set, so no group can play." >&2
            exit 1
          fi

      - name: Poll inbox and start any requested games
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python -m guessing_game.listen

      - name: Remember this game so characters never repeat
        run: |
          git config user.name "guessing-game bot"
          git config user.email "actions@github.com"
          # One at a time, and only if present. Naming a missing path makes
          # git add abort and stage nothing at all, including the files that
          # do exist — and .game-counts.json is absent until a game is played.
          for f in .history.jsonl .game-counts.json .handled-mail.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Nothing to save."
            exit 0
          fi
          git commit -m "Record game"
          # Another run may have pushed while this one played a game.
          git pull --rebase --autostash
          git push
